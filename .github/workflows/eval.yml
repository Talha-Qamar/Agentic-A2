# 30-job smoke evaluation on every pull request (open profile). Fails if bid/skip F1 drops or unsupported claims rise.
name: eval
on:
  pull_request:
  workflow_dispatch:
jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GIGBID_PROFILE: open
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-eval.txt}
      - run: pip install -r requirements-eval.txt
      - uses: actions/cache@v4
        with: {path: ~/.cache/fastembed, key: fastembed-v1}
      - name: Smoke eval (10 jobs per persona = 30 jobs) with regression gate
        run: python -m evals.runners.decision_eval --limit 10 --concurrency 2 --out smoke_eval.json --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: smoke-eval, path: evals/results/smoke_eval.json}
