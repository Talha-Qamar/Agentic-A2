name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: No secrets committed
        uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: GigSim unchanged since freeze, prompts only in agent/prompts, README numbers trace to evals/results
        run: python scripts/ci_guards.py
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gigbid" --health-interval 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
      GIGBID_PROFILE: stub
      GIGBID_EMBEDDER: hash
      GIGBID_RERANKER: overlap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-eval.txt}
      - run: pip install -r requirements-eval.txt
      - name: Lint
        run: ruff check .
      - name: Unit + contract tests
        run: pytest -q -m "not integration"
      - name: Integration tests (graph vs GigSim + MCP servers)
        run: pytest -q -m integration
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: Web build (type-checked against generated OpenAPI client)
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Playwright end-to-end
        working-directory: apps/web
        run: npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: apps/web/playwright-report}
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up smoke test
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health && break; sleep 5; done
          curl -fs localhost:8000/api/health
          docker compose down
