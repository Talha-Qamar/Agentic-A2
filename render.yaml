# Render blueprint (free plan): one web service runs GigBid in all-in-one mode (GigSim, the three MCP servers and the
# Arq worker in the API process) + free Postgres (pgvector) + free Key Value (Redis). See docs/RUNBOOK.md.
services:
  - type: web
    name: gigbid
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - {key: GIGBID_ALLINONE, value: "1"}
      - {key: GIGBID_PROFILE, value: open}
      - {key: GIGBID_PGVECTOR, value: "1"}
      - {key: PORT, value: "10000"}
      - {key: GIGSIM_URL, value: "http://127.0.0.1:10000/gigsim"}
      - {key: PORTFOLIO_MCP_URL, value: "http://127.0.0.1:10000/mcp/portfolio/mcp"}
      - {key: MARKETPLACE_MCP_URL, value: "http://127.0.0.1:10000/mcp/marketplace/mcp"}
      - {key: WORKSPACE_MCP_URL, value: "http://127.0.0.1:10000/mcp/workspace/mcp"}
      - {key: GIGSIM_DB, value: /tmp/gigsim.db}
      - {key: GIGSIM_SPEED, value: "0.5"}
      - {key: GIGSIM_POLICY_VERSION, value: "2026-11-02"}
      - {key: EMBED_THREADS, value: "1"}
      - {key: DB_POOL_MAX, value: "4"}
      - {key: GIGBID_SECRET, generateValue: true}
      - {key: GIGSIM_ADMIN_KEY, generateValue: true}
      - {key: GROQ_API_KEY, sync: false}
      - {key: NVIDIA_API_KEY, sync: false}
      - {key: REVIEWER_EMAIL, sync: false}
      - {key: REVIEWER_PASSWORD, sync: false}
      - key: DATABASE_URL
        fromDatabase: {name: gigbid-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: gigbid-kv, property: connectionString}
  - type: keyvalue
    name: gigbid-kv
    plan: free
    region: singapore
    ipAllowList: []
databases:
  - name: gigbid-db
    plan: free
    region: singapore
    databaseName: gigbid
    user: gigbid
