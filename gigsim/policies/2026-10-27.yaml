# GigSim platform policy - baseline (assignment issue date)
version: "2026-10-27"
effective_from: "2026-10-27"
connects:
  weekly_allowance: 80
  # cost by fixed budget tier (USD upper bounds); hourly jobs use hourly_cost
  fixed_tiers:
    - {max_budget: 500, cost: 4}
    - {max_budget: 2000, cost: 8}
    - {max_budget: null, cost: 12}
  hourly_cost: 8
limits:
  daily_proposal_cap: null
  max_cover_letter_chars: 5000
  min_cover_letter_chars: 200
requirements:
  ai_disclosure: false
rules:
  - id: no_off_platform
    text: "No off-platform contact details (email, phone, messaging handles) or payment outside the platform."
  - id: no_fabrication
    text: "Do not claim experience, clients, credentials or results you do not have."
  - id: no_guarantees
    text: "Do not guarantee outcomes such as rankings, revenue or 100% satisfaction."
  - id: fair_automation
    text: "Automation may draft proposals, but a human must review and submit them. No bulk or unattended submissions."
